:", "o": ["Underfitting", "Overfitting", "Data leakage", "Regularization"], "a": 2, "e": "It is the most common serious bug in applied ML."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "The giveaway of overfitting is:", "o": ["Very low training error but high test error", "Low test error", "Equal errors", "High training and test error"], "a": 0, "e": "The model memorised past papers."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "Underfitting means:", "o": ["Perfect training accuracy", "The model is too simple and performs badly everywhere", "High variance", "Data leakage"], "a": 1, "e": "The student who did not study."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "High bias is associated with:", "o": ["A model chasing noise", "A model too simple to capture the pattern", "Data leakage", "A perfect fit"], "a": 1, "e": "High variance means the model is too flexible and chases noise."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "The 'No Free Lunch' theorem says:", "o": ["No single algorithm is best across all possible problems", "The best algorithm is always a neural network", "Complex models always win", "Data is free"], "a": 0, "e": "Averaged over all problems, all algorithms perform the same."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "'Garbage in, garbage out' reminds us that:", "o": ["Cleaning is unnecessary", "Models fix bad data", "Data quality largely determines model quality", "Modelling takes most of the time"], "a": 2, "e": "Most real project time goes to collecting, cleaning and labelling data."}, {"s": "AI", "t": "Evaluation Metrics and Big Data", "q": "One transaction in a thousand is fraud. A model that always says 'not fraud' has accuracy:", "o": ["99.9%", "0.1%", "0%", "50%"], "a": 0, "e": "Accuracy measures the majority class, and frauds caught = zero."}, {"s": "AI", "t": "Evaluation Metrics and Big Data", "q": "Precision is:", "o": ["TP / (TP + TN)", "(TP + TN) / total", "TP / (TP + FP)", "TP / (TP + FN)"], "a": 2, "e": "Of all predicted positives, how many were truly positive."}, {"s": "AI", "t": "Evaluation Metrics and Big Data", "q": "Recall is:", "o": ["TP / (TP + FN)", "TN / (TN + FP)", "TP / (TP + FP)", "FP / (FP + TN)"], "a": 0, "e": "Of all actual positives, how many were found."}, {"s": "AI", "t": "Evaluation Metrics and Big Data", "q": "A model has TP = 40, FP = 10, FN = 60. Its precision and recall are:", "o": ["0.8 and 0.4", "0.5 and 0.5", "0.8 and 0.8", "0.4 and 0.8"], "a": 0, "e": "Precision = 40/50 = 0.8; recall = 40/100 = 0.4."}, {"s": "AI", "t": "Evaluation Metrics and Big Data", "q": "For TP = 40, FP = 10, FN = 60 the F1 score is about:", "o": ["0.60", "0.53", "0.40", "0.80"], "a": 1, "e": "F1 = 2·0.8·0.4/(0.8 + 0.4) = 0.64/1.2 ≈ 0.53."}, {"s": "AI", "t": "Evaluation Metrics and Big Data", "q": "F1 is the:", "o": ["Arithmetic mean of accuracy and recall", "Product of precision and recall", "Difference between them", "Harmonic mean of precision and recall"], "a": 3, "e": "It gives one number when both matter."}, {"s": "AI", "t": "Evaluation Metrics and Big Data", "q": "For cancer screening you should favour:", "o": ["Recall", "Accuracy only", "Specificity only", "Precision"], "a": 0, "e": "A missed case may be fatal; a false alarm costs a follow-up test."}, {"s": "AI", "t": "Evaluation Metrics and Big Data", "q": "For spam filtering you should favour:", "o": ["Accuracy", "Recall", "Precision", "Training error"], "a": 2, "e": "A job offer in the spam folder is a disaster."}, {"s": "AI", "t": "Evaluation Metrics and Big Data", "q": "Moving the decision threshold typically:", "o": ["Changes nothing", "Trades precision against recall", "Removes false positives", "Improves both"], "a": 1, "e": "Whoever chooses decides who bears the cost of the errors."}, {"s": "AI", "t": "Evaluation Metrics and Big Data", "q": "The 'one habit' to leave the course with is:", "o": ["Always use the largest model", "Report only accuracy", "Delete sensitive attributes", "Never report a single accuracy number; break performance down by subgroup"], "a": 3, "e": "An overall 94% can hide 98% for one group and 61% for another."}, {"s": "AI", "t": "Evaluation Metrics and Big Data", "q": "The 5 Vs of big data are:", "o": ["Velocity, Vision, Variety, Voltage, Value", "Volume, Velocity, Variety, Veracity, Value", "Volume, Version, Variety, Veracity, Vector", "Volume, Validity, Variance, Vector, Value"], "a": 1, "e": "Veracity and value are the ones people skip."}, {"s": "AI", "t": "Evaluation Metrics and Big Data", "q": "JSON, XML and log files are examples of:", "o": ["Semi-structured data", "Structured data", "Unstructured data", "Metadata only"], "a": 0, "e": "Tagged but not in a fixed schema."}, {"s": "AI", "t": "Evaluation Metrics and Big Data", "q": "Roughly what share of organisational data is unstructured?", "o": ["About 20%", "About 50%", "About 5%", "About 80%"], "a": 3, "e": "Text, images, audio and video."}, {"s": "AI", "t": "Evaluation Metrics and Big Data", "q": "'Why did sales fall?' is a ______ analytics question.", "o": ["Prescriptive", "Diagnostic", "Descriptive", "Predictive"], "a": 1, "e": "Descriptive: what happened; predictive: what next; prescriptive: what to do."}, {"s": "AI", "t": "Evaluation Metrics and Big Data", "q": "'Cut these prices and stock these items' is ______ analytics.", "o": ["Diagnostic", "Descriptive", "Predictive", "Prescriptive"], "a": 3, "e": "It recommends what to do."}, {"s": "AI", "t": "Evaluation Metrics and Big Data", "q": "'Another 5% fall is likely next month' is ______ analytics.", "o": ["Predictive", "Diagnostic", "Prescriptive", "Descriptive"], "a": 0, "e": "It forecasts what is next."}, {"s": "AI", "t": "Evaluation Metrics and Big Data", "q": "Hadoop uses ______ for storage and ______ for computation.", "o": ["MapReduce; HDFS", "Spark; Hive", "SQL; NoSQL", "HDFS; MapReduce"], "a": 3, "e": "Spark does the same idea in memory, far faster."}, {"s" let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { saved = {}; }
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} }

const state = { sec: "all", topic: "all", status: "all", order: DATA.map((_, i) => i) };
const $ = id => document.getElementById(id);
const L = "ABCD";

function topicsFor(sec){
  const seen = [];
  DATA.forEach(q => { if ((sec === "all" || q.s === sec) && !seen.includes(q.t)) seen.push(q.t); });
  return seen;
}
function fillTopics(){
  const sel = $("topic"); sel.innerHTML = "";
  const first = document.createElement("option"); first.value = "all"; first.textContent = "All topics"; sel.appendChild(first);
  topicsFor(state.sec).forEach(t => {
    const n = DATA.filter(q => q.t === t).length;
    const o = document.createElement("option"); o.value = t; o.textContent = t + " (" + n + ")"; sel.appendChild(o);
  });
  state.topic = "all";
}
function visible(){
  return state.order.filter(i => {
    const q = DATA[i];
    if (state.sec !== "all" && q.s !== state.sec) return false;
    if (state.topic !== "all" && q.t !== state.topic) return false;
    const a = saved[i];
    if (state.status === "new" && a !== undefined) return false;
    if (state.status === "wrong" && !(a !== undefined && a !== q.a)) return false;
    return true;
  });
}
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

function renderCard(i, n){
  const q = DATA[i];
  const card = el("article", "q");
  const meta = el("div", "meta");
  meta.append(el("span", "n", "Q" + n), el("span", "", q.t));
  card.append(meta, el("h2", "", q.q));
  const opts = el("div", "opts");
  const done = saved[i] !== undefined;
  q.o.forEach((txt, k) => {
    const b = el("button", "opt"); b.type = "button";
    b.append(el("span", "l", L[k]));
    const span = el("span", "", txt); b.append(span);
    if (done) {
      b.disabled = true;
      if (k === q.a) { b.classList.add("right"); span.append(el("span", "tag", saved[i] === q.a ? "Correct" : "Correct answer")); }
      else if (k === saved[i]) { b.classList.add("wrong"); span.append(el("span", "tag", "Your answer")); }
    } else {
      b.addEventListener("click", () => { saved[i] = k; persist(); card.replaceWith(renderCard(i, n)); updateScore(); if (state.status !== "all") {} });
    }
    opts.append(b);
  });
  card.append(opts);
  if (done) { const w = el("p", "why"); w.append(el("b", "", "Why"), document.createTextNode(q.e)); card.append(w); }
  return card;
}
function render(){
  const list = $("list"); list.innerHTML = "";
  const ids = visible();
  if (!ids.length) { list.append(el("p", "empty", "No questions match these filters.")); }
  const frag = document.createDocumentFragment();
  ids.forEach((i, n) => frag.append(renderCard(i, n + 1)));
  list.append(frag);
  updateScore();
}
function updateScore(){
  const ids = state.order.filter(i => (state.sec === "all" || DATA[i].s === state.sec) && (state.topic === "all" || DATA[i].t === state.topic));
  let done = 0, ok = 0;
  ids.forEach(i => { if (saved[i] !== undefined) { done++; if (saved[i] === DATA[i].a) ok++; } });
  const total = ids.length;
  $("sDone").textContent = done; $("sTotal").textContent = total;
  $("sOk").textContent = ok; $("sBad").textContent = done - ok;
  $("sPct").textContent = done ? Math.round(100 * ok / done) + "% accuracy" : "";
  $("tOk").style.width = (total ? 100 * ok / total : 0) + "%";
  $("tBad").style.width = (total ? 100 * (done - ok) / total : 0) + "%";
}
function setSec(s){
  state.sec = s;
  [["secAll","all"],["secMath","Math"],["secAI","AI"]].forEach(([id, v]) => $(id).setAttribute("aria-pressed", String(v === s)));
  fillTopics(); render();
}
$("secAll").onclick = () => setSec("all");
$("secMath").onclick = () => setSec("Math");
$("secAI").onclick = () => setSec("AI");
$("topic").onchange = e => { state.topic = e.target.value; render(); };
$("status").onchange = e => { state.status = e.target.value; render(); };
$("shuf").onclick = () => {
  const a = state.order;
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  render(); window.scrollTo({ top: 0 });
};
let armed = false;
$("reset").onclick = () => {
  const b = $("reset");
  if (!armed) { armed = true; b.textContent = "Tap again to confirm"; setTimeout(() => { armed = false; b.textContent = "Reset progress"; }, 3000); return; }
  armed = false; b.textContent = "Reset progress"; saved = {}; persist(); render();
};
fillTopics(); render();
</script>

</body></html>
