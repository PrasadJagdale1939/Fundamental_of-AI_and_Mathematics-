.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
select,.btn{font:500 .85rem var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;cursor:pointer}

.btn:hover,select:hover{border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;gap:14px;margin-top:16px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:8px;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.meta .n{font-family:var(--f-mono);color:var(--accent);font-weight:600;letter-spacing:0}

, "[[1, 1], [0, 1]]", "[[0, 1], [1, 0]]"], "a": 3, "e": "Its columns are orthonormal, so QᵀQ = I."}, {"s": "Math", "t": "Matrix Properties and Approximation", "q": "A symmetric matrix A is positive definite if:", "o": ["All entries are positive", "det(A) = 0", "xᵀAx = 0 for all x", "xᵀAx > 0 for all nonzero x"], "a": 3, "e": "This is the definition of positive definiteness."}, {"s": "Math", "t": "Matrix Properties and Approximation", "q": "The best rank-k approximation of a matrix (in Frobenius norm) comes from:", "o": ["Taking its trace", "Taking its transpose", "Adding the identity", "Truncated SVD"], "a": 3, "e": "Eckart–Young theorem: keep the k largest singular values."}, {"s": "Math", "t": "Matrix Properties and Approximation", "q": "The Frobenius norm of [[1, 2], [2, 4]] is:", "o": ["5", "9", "3", "25"], "a": 0, "e": "√(1 + 4 + 4 + 16) = √25 = 5."}, {"s": "Math", "t": "Matrix Properties and Approximation", "q": "If Q is orthogonal, then ||Qx|| is:", "o": ["Always 0", "Equal to ||x||", "Equal to 2||x||", "Equal to ||x||²"], "a": 1, "e": "Orthogonal matrices preserve lengths."}, {"s": "Math", "t": "Matrix Properties and Approximation", "q": "Which matrix is positive definite?", "o": ["[[0, 1], [1, 0]]", "[[2, 1], [1, 2]]", "[[1, 2], [2, 1]]", "[[−2, 0], [0, −1]]"], "a": 1, "e": "Eigenvalues of [[2,1],[1,2]] are 1 and 3, both positive."}, {"s": "Math", "t": "Matrix Properties and Approximation", "q": "A 2 × 2 matrix has trace 7 and determinant 12. Its eigenvalues are:", "o": ["5 and 2", "3 and 4", "1 and 12", "2 and 6"], "a": 1, "e": "Sum = 7 and product = 12 give 3 and 4."}, {"s": "Math", "t": "Matrix Properties and Approximation", "q": "The inverse of the diagonal matrix diag(2, 4) is:", "o": ["diag(1/2, 1/4)", "diag(−2, −4)", "diag(4, 2)", "diag(2, 4)"], "a": 0, "e": "Invert each diagonal entry."}, {"s": "Math", "t": "Eigenvalues, PCA and SVD", "q": "The eigenvalues of [[2, 0], [0, 7]] are:", "o": ["0 and 9", "2 and 7", "2 and −7", "9 and 14"], "a": 1, "e": "For a diagonal matrix they are the diagonal entries."}, {"s": "Math", "t": "Eigenvalues, PCA and SVD", "q": "The eigenvalues of A = [[4, 1], [2, 3]] are:", "o": ["−2 and 5", "1 and 6", "4 and 3", "2 and 5"], "a": 3, "e": "λ² − 7λ + 10 = 0 gives λ = 2, 5."}, {"s": "Math", "t": "Eigenvalues, PCA and SVD", "q": "The eigenvalues of [[1, 2], [2, 1]] are:", "o": ["1 and 2", "3 and 1", "0 and 2", "3 and −1"], "a": 3, "e": "(1 − λ)² − 4 = 0 gives λ = 3, −1."}, {"s": "Math", "t": "Eigenvalues, PCA and SVD", "q": "An eigenvector of [[2, 0], [0, 3]] for eigenvalue 3 is:", "o": ["(1, 0)", "(3, 0)", "(1, 1)", "(0, 1)"], "a": 3, "e": "A(0,1) = (0,3) = 3(0,1)."}, {"s": "Math", "t": "Eigenvalues, PCA and SVD", "q": "The eigenvalues of [[5, 4], [1, 2]] are:", "o": ["2 and 5", "1 and 6", "3 and 4", "−1 and 7"], "a": 1, "e": "Trace 7, determinant 6 gives λ = 1, 6."}, {"s": "Math", "t": "Eigenvalues, PCA and SVD", "q": "A 2 × 2 matrix has trace 9 and one eigenvalue 4. The other eigenvalue is:", "o": ["13", "5", "36", "4"], "a": 1, "e": "Eigenvalues sum to the trace: 9 − 4 = 5."}, {"s": "Math", "t": "Eigenvalues, PCA and SVD", "q": "Covariance eigenvalues are 8, 1 and 1. The first principal component explains:", "o": ["100% of the variance", "80% of the variance", "50% of the variance", "8% of the variance"], "a": 1, "e": "8/(8 + 1 + 1) = 80%."}, {"s": "Math", "t": "Eigenvalues, PCA and SVD", "q": "Covariance eigenvalues are 5, 3 and 2. The variance explained by the first two components is:", "o": ["100%", "30%", "80%", "50%"], "a": 2, "e": "(5 + 3)/10 = 80%."}, {"s": "Math", "t": "Eigenvalues, PCA and SVD", "q": "Before applying PCA, the data is usually:", "o": ["Centered by subtracting the mean", "Sorted", "Squared", "Converted to labels"], "a": 0, "e": "PCA works on covariance, which assumes mean-centered data."}, {"s": "Math", "t": "Eigenvalues, PCA and SVD", "q": "Different principal components are:", "o": ["Parallel", "Always identical", "Orthogonal to each other", "Linearly dependent"], "a": 2, "e": "Principal directions are orthogonal eigenvectors of the covariance matrix."}, {"s": "Math", "t": "Eigenvalues, PCA and SVD", "q": "The singular values of A are:", "o": ["The squares of the eigenvalues of A", "The eigenvalues of A", "The square roots of the eigenvalues of AᵀA", "The diagonal entries of A"], "a": 2, "e": "σᵢ = √λᵢ(AᵀA)."}, {"s": "Math", "t": "Eigenvalues, PCA and SVD", "q": "If AᵀA has eigenvalues 16 and 9, the singular values of A are:", "o": ["4 and 3", "8 and 4.5", "256 and 81", "16 and 9"], "a": 0, "e": "Take square roots."}, {"s": "Math", "t": "Eigenvalues, PCA and SVD", "q": "If a square matrix has eigenvalue 0, then it is:", "o": ["Singular (not invertible)", "Positive definite", "Orthogonal", "The identity"], "a": 0, "e": "Determinant is the product of eigenvalues, which is then 0."}, {"s": "Math", "t": "Eigenvalues, PCA and SVD", "q": "If A has eigenvalues 2 and −3, the eigenvalues of A² are:", "o": ["2 and 3", "4 and −9", "4 and 9", "−4 and 9"], "a": 2, "e": "Eigenvalues of A² are the squares of those of A."}, {"s": "Math", "t": "Eigenvalues, PCA and SVD", "q": "The eigenvalues of a matrix A are found by solving:", "o": ["A − λ = 0", "det(A − λI) = 0", "det(A) = λ", "AᵀA = λI"], "a": 1, "e": "This is the characteristic equation."}, {"s": "Math", "t": "Eigenvalues, PCA and SVD", "q": "The main use of PCA in machine learning is:", "o": ["Increasing the number of features", "Sorting data", "Dimensionality reduction", "Labelling data"], "a": 2, "e": "PCA keeps the directions of largest variance."}, {"s": "Math", "t": "Differentiation and Gradients", "q": "If f(x) = x² eˣ, then f′(x) is:", "o": ["2x + eˣ", "2x eˣ", "(x² + 2x)eˣ", "x² eˣ"], "a": 2, "e": "Product rule: 2x·eˣ + x²·eˣ."}, {"s": "Math", "t": "Differentiation and Gradients", "q": "d/dx [ln(x² + 1)] is:", "o": ["2x/(x² + 1)", "1/(x² + 1)", "2x", "ln(2x)"], "a": 0, "e": "Chain rule: (1/u)·u′ with u = x² + 1."}, {"s": "Math", "t": "Differentiation and Gradients", "q": "d/dx [sin(3x)] is:", "o": ["cos(3x)", "3 cos(3x)", "−3 cos(3x)", "3 sin(3x)"], "a": 1, "e": "Chain rule gives an extra factor 3."}, {"s": "Math", "t": "Differentiation and Gradients", "q": "d/dx (1/x) is:", "o": ["ln x", "−1/x", "1/x²", "−1/x²"], "a": 3, "e": "Power rule with x⁻¹."}, {"s": "Math", "t": "Differentiation and Gradients", "q": "If f(x) = x³ − 3x, then f′(2) is:", "o": ["6", "9", "12", "3"], "a": 1, "e": "f′(x) = 3x² − 3; at 2 this is 9."}, {"s": "Math", "t": "Differentiation and Gradients", "q": "For f(x, y) = x² y³, ∂f/∂y is:", "o": ["x² y²", "2x y³", "6x y²", "3x² y²"], "a": 3, "e": "Treat x as constant."}, {"s": "Math", "t": "Differentiation and Gradients", "q": "The gradient of f(x, y, z) = x² + y² + z² at (1, 2, 3) is:", "o": ["(2, 4, 6)", "(2, 2, 2)", "(14, 14, 14)", "(1, 2, 3)"], "a": 0, "e": "∇f = (2x, 2y, 2z)."}, {"s": "Math", "t": "Differentiation and Gradients", "q": "If z = sin(u) and u = x², then dz/dx is:", "o": ["cos(x²)", "2x cos(x²)", "x² cos(x)", "2x sin(x²)"], "a": 1, "e": "Chain rule: cos(u)·2x."}, {"s": "Math", "t": "Differentiation and Gradients", "q": "d/dx [x/(x + 1)] is:", "o": ["x/(x + 1)²", "−1/(x + 1)²", "1/(x + 1)", "1/(x + 1)²"], "a": 3, "e": "Quotient rule: [(x + 1) − x]/(x + 1)²."}, {"s": "Math", "t": "Differentiation and Gradients", "q": "For f(x, y) = x² + y², the directional derivative at (1, 2) in the direction (3, 4)/5 is:", "o": ["2", "6", "22/5", "14/5"], "a": 2, "e": "∇f = (2, 4); dot with (3/5, 4/5) = 6/5 + 16/5 = 22/5."}, {"s": "Math", "t": "Differentiation and Gradients", "q": "Let f(x, y, z) = xy·e^(x² + z² − 5). The gradient at (1, 3, −2) is:", "o": ["(9, 3, −12)", "(1, 3, −2)", "(3, 1, −4)", "(9, 1, −12)"], "a": 3, "e": "At the point the exponent is 0, so e⁰ = 1. fₓ = y + 2x²y = 9, f_y = x = 1, f_z = 2xyz = −12."}, {"s": "Math", "t": "Differentiation and Gradients", "q": "For the same f = xy·e^(x² + z² − 5) at (1, 3, −2), the directional derivative along v = (3, −1, 4) is:", "o": ["−22/26", "−22", "22/√26", "−22/√26"], "a": 3, "e": "∇f · v = 27 − 1 − 48 = −22, and ||v|| = √26."}, {"s": "Math", "t": "Differentiation and Gradients", "q": "The gradient of a function at a point is perpendicular to:", "o": ["The x-axis", "The level curve through that point", "The function's graph", "The gradient of another function"], "a": 1, "e": "The gradient is normal to level sets."}, {"s": "Math", "t": "Differentiation and Gradients", "q": "If ∇f = (3, 4) at a point, the maximum directional derivative there is:", "o": ["1", "5", "7", "12"], "a": 1, "e": "The maximum rate of increase equals ||∇f|| = 5."}, {"s": "Math", "t": "Differentiation and Gradients", "q": "If f(x) = x⁴, then f″(x) is:", "o": ["x²", "12x²", "4x³", "24x"], "a": 1, "e": "f′ = 4x³ and f″ = 12x²."}, {"s": "Math", "t": "Differentiation and Gradients", "q": "For f(x, y) = x² y³, the mixed partial ∂²f/∂x∂y is:", "o": ["3x² y²", "2x y³", "6x² y", "6x y²"], "a": 3, "e": "∂f/∂y = 3x²y²; differentiating by x gives 6xy²."}, {"s": "Math", "t": "Differentiation and Gradients", "q": "If z = xy with x = t² and y = t³, then dz/dt is:", "o": ["6t⁵", "t⁵", "5t⁴", "5t"], "a": 2, "e": "z = t⁵, so dz/dt = 5t⁴."}, {"s": "Math", "t": "Jacobian, Matrix Calculus and Taylor Series", "q": "The Hessian of f(x, y) = x²y is:", "o": ["[[2, 0], [0, 0]]", "[[2y, x²], [x², 0]]", "[[0, 2x], [2x, 2y]]", "[[2y, 2x], [2x, 0]]"], "a": 3, "e": "fₓₓ = 2y, fₓᵧ = 2x, f_yy = 0."}, {"s": "Math", "t": "Jacobian, Matrix Calculus and Taylor Series", "q": "The Jacobian of F(x, y) = (xy, x + y) is:", "o": ["[[x, y], [1, 1]]", "[[1, 1], [y, x]]", "[[y, x], [1, 1]]", "[[y, 1], [x, 1]]"], "a": 2, "e": "Each row holds the partial derivatives of one output."}, {"s": "Math", "t": "Jacobian, Matrix Calculus and Taylor Series", "q": "The second-order Taylor expansion of f around a includes the term:", "o": ["½ (x − a)ᵀ H (x − a)", "∇f(x) only", "(x − a)ᵀ(x − a)", "H⁻¹(x − a)"], "a": 0, "e": "The quadratic term uses the Hessian H."}, {"s": "Math", "t": "Jacobian, Matrix Calculus and Taylor Series", "q": "Using the linearization of √x at x = 4, √4.2 is approximately:", "o": ["2.2", "2.02", "2.1", "2.05"], "a": 3, "e": "√x ≈ 2 + (1/4)(x − 4) = 2 + 0.05."}, {"s": "Math", "t": "Jacobian, Matrix Calculus and Taylor Series", "q": "If second partial derivatives are continuous, the Hessian is:", "o": ["Symmetric", "Antisymmetric", "Always zero", "Diagonal"], "a": 0, "e": "Mixed partials are equal (Clairaut's theorem)."}, {"s": "Math", "t": "Jacobian, Matrix Calculus and Taylor Series", "q": "∇ₓ(xᵀx) equals:", "o": ["x", "2x", "xᵀ", "2"], "a": 1, "e": "d/dx of Σxᵢ² is 2x."}, {"s": "Math", "t": "Jacobian, Matrix Calculus and Taylor Series", "q": "For F(x) = Mx, where M is a constant matrix, the Jacobian is:", "o": ["M", "Mᵀ", "0", "M⁻¹"], "a": 0, "e": "A linear map has constant Jacobian equal to its matrix."}, {"s": "Math", "t": "Jacobian, Matrix Calculus and Taylor Series", "q": "If F: R² → R³, its Jacobian has dimension:", "o": ["3 × 2", "3 × 3", "2 × 3", "2 × 2"], "a": 0, "e": "One row per output (3), one column per input (2)."}, {"s": "Math", "t": "Jacobian, Matrix Calculus and Taylor Series", "q": "Using a first-order Taylor expansion of eˣ near 0, e^0.2 ≈:", "o": ["0.8", "1.02", "1.4", "1.2"], "a": 3, "e": "eˣ ≈ 1 + x."}, {"s": "Math", "t": "Jacobian, Matrix Calculus and Taylor Series", "q": "The Hessian of f(x, y) = x² + 3xy + y² is:", "o": ["[[1, 3], [3, 1]]", "[[2x, 3], [3, 2y]]", "[[2, 0], [0, 2]]", "[[2, 3], [3, 2]]"], "a": 3, "e": "fₓₓ = 2, fₓᵧ = 3, f_yy = 2."}, {"s": "Math", "t": "Jacobian, Matrix Calculus and Taylor Series", "q": "The second-order Taylor expansion of cos x about 0 is:", "o": ["1 + x²/2", "1 − x²/2", "1 − x", "x − x³/6"], "a": 1, "e": "cos x ≈ 1 − x²/2."}, {"s": "Math", "t": "Jacobian, Matrix Calculus and Taylor Series", "q": "For symmetric A, ∇ₓ(½ xᵀAx) equals:", "o": ["Ax", "xᵀA", "2Ax", "A"], "a": 0, "e": "The ½ cancels the factor 2 from ∇(xᵀAx) = 2Ax."}, {"s": "Math", "t": "Jacobian, Matrix Calculus and Taylor Series", "q": "The determinant of the Jacobian gives:", "o": ["The learning rate", "The gradient", "The loss", "The local scaling of volume under the map"], "a": 3, "e": "It measures how the map stretches small regions."}, {"s": "Math", "t": "Backpropagation and Automatic Differentiation", "q": "Reverse-mode automatic differentiation is efficient when there are:", "o": ["No inputs", "Many inputs and one scalar output", "Exactly two inputs", "One input and many outputs"], "a": 1, "e": "A neural network loss is a scalar of many parameters, which suits reverse mode."}, {"s": "Math", "t": "Backpropagation and Automatic Differentiation", "q": "For L = (wx − y)² with w = 1, x = 2, y = 0, ∂L/∂w is:", "o": ["4", "2", "16", "8"], "a": 3, "e": "2(wx − y)x = 2(2)(2) = 8."}, {"s": "Math", "t": "Backpropagation and Automatic Differentiation", "q": "The sigmoid derivative σ′(z) equals:", "o": ["σ(z)²", "1 − σ(z)", "1/σ(z)", "σ(z)(1 − σ(z))"], "a": 3, "e": "At σ = 0.5 this gives the maximum 0.25."}, {"s": "Math", "t": "Backpropagation and Automatic Differentiation", "q": "The ReLU derivative for z > 0 is:", "o": ["1", "0", "−1", "z"], "a": 0, "e": "ReLU(z) = z for positive z."}, {"s": "Math", "t": "Backpropagation and Automatic Differentiation", "q": "Backpropagation applies which rule from output back to input?", "o": ["The quotient rule only", "L'Hôpital's rule", "The product rule only", "The chain rule"], "a": 3, "e": "Local derivatives are multiplied along the computational graph."}, {"s": "Math", "t": "Backpropagation and Automatic Differentiation", "q": "If z = x·y and y = x + 1, then dz/dx at x = 2 is:", "o": ["5", "6", "3", "2"], "a": 0, "e": "dz/dx = y + x(dy/dx) = 3 + 2 = 5."}, {"s": "Math", "t": "Backpropagation and Automatic Differentiation", "q": "Backpropagation versus gradient descent: backprop", "o": ["Replaces the loss function", "Is the same as gradient descent", "Computes gradients that gradient descent then uses", "Chooses the learning rate"], "a": 2, "e": "Backprop gives ∇L; the optimizer applies the update."}, {"s": "Math", "t": "Backpropagation and Automatic Differentiation", "q": "Gradients that grow uncontrollably across layers are called:", "o": ["Stable gradients", "Dropout", "Exploding gradients", "Vanishing gradients"], "a": 2, "e": "Gradient clipping is one common remedy."}, {"s": "Math", "t": "Backpropagation and Automatic Differentiation", "q": "Automatic differentiation differs from numerical differentiation because it:", "o": ["Needs no computational graph", "Uses small finite differences", "Estimates gradients randomly", "Gives exact derivatives up to floating-point precision"], "a": 3, "e": "AD applies the chain rule exactly to elementary operations."}, {"s": "Math", "t": "Gradient Descent and Optimization", "q": "For L(w) = w², w = 3 and η = 0.1, one gradient descent step gives:", "o": ["2.7", "0.6", "2.4", "3.6"], "a": 2, "e": "w − η·2w = 3 − 0.6 = 2.4."}, {"s": "Math", "t": "Gradient Descent and Optimization", "q": "For L(w) = (w − 2)², w = 5 and η = 0.25, one step gives:", "o": ["2", "4.5", "1.5", "3.5"], "a": 3, "e": "Gradient = 2(3) = 6; 5 − 1.5 = 3.5."}, {"s": "Math", "t": "Gradient Descent and Optimization", "q": "At a minimum of a differentiable loss, a gradient descent update:", "o": ["Leaves the parameters unchanged", "Reverses sign", "Doubles the parameters", "Diverges"], "a": 0, "e": "Gradient is zero, so θ_new = θ."}, {"s": "Math", "t": "Gradient Descent and Optimization", "q": "A very small learning rate typically causes:", "o": ["Divergence", "A random result", "Slow convergence", "Overshooting"], "a": 2, "e": "Steps are tiny, so many iterations are needed."}, {"s": "Math", "t": "Gradient Descent and Optimization", "q": "For L(w) = 3w², w = 1, η = 0.1, one step gives:", "o": ["−0.5", "0.4", "0.9", "0.7"], "a": 1, "e": "Gradient = 6w = 6; 1 − 0.6 = 0.4."}, {"s": "Math", "t": "Gradient Descent and Optimization", "q": "For f(x, y) = x² + y² starting at (1, 2) with η = 0.5, one step gives:", "o": ["(0, 0)", "(−1, −2)", "(0.5, 1)", "(1, 2)"], "a": 0, "e": "∇f = (2, 4); (1, 2) − 0.5(2, 4) = (0, 0)."}, {"s": "Math", "t": "Gradient Descent and Optimization", "q": "For L(w) = w² with η = 1 starting at w = 2, the iterates:", "o": ["Converge to 0", "Stay at 2", "Diverge to infinity", "Oscillate between 2 and −2"], "a": 3, "e": "w − 1·2w = −w, so the sign flips each step."}, {"s": "Math", "t": "Gradient Descent and Optimization", "q": "For L(w) = 2w² (L = ½aw² with a = 4), gradient descent converges if:", "o": ["η > 0.5", "0 < η < 0.5", "η = 0 only", "0 < η < 2"], "a": 1, "e": "The condition is 0 < η < 2/a = 0.5."}, {"s": "Math", "t": "Gradient Descent and Optimization", "q": "Gradient ascent updates parameters using:", "o": ["η∇f(θ) only", "θ + η∇f(θ)", "θ/∇f(θ)", "θ − η∇f(θ)"], "a": 1, "e": "Ascent moves along the gradient to increase f."}, {"s": "Math", "t": "Gradient Descent and Optimization", "q": "On a non-convex function, gradient descent can:", "o": ["End in a local minimum or a saddle region", "Always find the global minimum", "Never converge", "Only move upward"], "a": 0, "e": "There is no global guarantee without convexity."}, {"s": "Math", "t": "Gradient Algorithms and Performance", "q": "With 1000 training examples and a mini-batch size of 100, the number of updates per epoch is:", "o": ["10", "1", "1000", "100"], "a": 0, "e": "1000/100 = 10 updates."}, {"s": "Math", "t": "Gradient Algorithms and Performance", "q": "With 500 examples, standard SGD (batch size 1) makes how many updates per epoch?", "o": ["5", "1", "500", "50"], "a": 2, "e": "One update per example."}, {"s": "Math", "t": "Gradient Algorithms and Performance", "q": "Noise in SGD can help because it:", "o": ["May help escape shallow local minima and saddle points", "Makes the loss always decrease", "Guarantees the global optimum", "Removes the need for a learning rate"], "a": 0, "e": "Random fluctuations can push the iterate out of flat or poor regions."}, {"s": "Math", "t": "Gradient Algorithms and Performance", "q": "Compared with SGD, mini-batch gradient estimates have:", "o": ["Lower variance", "Higher variance", "No variance", "Exactly the full gradient"], "a": 0, "e": "Averaging over several examples reduces noise."}, {"s": "Math", "t": "Gradient Algorithms and Performance", "q": "One epoch means:", "o": ["One mini-batch", "One layer", "One full pass over the training data", "One parameter update"], "a": 2, "e": "Epoch = every training example seen once."}, {"s": "Math", "t": "Gradient Algorithms and Performance", "q": "Which method has the most stable but costliest updates on a large dataset?", "o": ["Mini-batch with small batches", "Batch gradient descent", "They are identical", "SGD"], "a": 1, "e": "It uses the whole dataset for every step."}, {"s": "Math", "t": "Constrained Optimization, Convexity and Extrema", "q": "A twice-differentiable f of one variable with f″(x) > 0 everywhere is:", "o": ["Convex", "Concave", "Constant", "Linear"], "a": 0, "e": "A positive second derivative means convex."}, {"s": "Math", "t": "Constrained Optimization, Convexity and Extrema", "q": "For f(x) = x³ − 3x, the point x = 1 is a:", "o": ["Local maximum", "Global maximum", "Saddle point", "Local minimum"], "a": 3, "e": "f′(1) = 0 and f″(1) = 6 > 0."}, {"s": "Math", "t": "Constrained Optimization, Convexity and Extrema", "q": "The minimum value of f(x) = x² − 4x + 7 is:", "o": ["0", "2", "7", "3"], "a": 3, "e": "Minimum at x = 2; f(2) = 4 − 8 + 7 = 3."}, {"s": "Math", "t": "Constrained Optimization, Convexity and Extrema", "q": "If the Hessian at a stationary point is indefinite, the point is a:", "o": ["Local minimum", "Global minimum", "Saddle point", "Local maximum"], "a": 2, "e": "Mixed-sign eigenvalues indicate a saddle."}, {"s": "Math", "t": "Constrained Optimization, Convexity and Extrema", "q": "Maximum of xy subject to x + y = 20 (x, y ≥ 0) is:", "o": ["200", "400", "0", "100"], "a": 3, "e": "Max at x = y = 10, so xy = 100."}, {"s": "Math", "t": "Constrained Optimization, Convexity and Extrema", "q": "At a constrained optimum of f subject to g = 0, Lagrange's condition says:", "o": ["∇f = 0 only", "∇f = λ∇g", "f = λg", "∇f · ∇g = 1"], "a": 1, "e": "The gradients are parallel."}, {"s": "Math", "t": "Constrained Optimization, Convexity and Extrema", "q": "Minimum of x² + y² subject to x + y = 4 is:", "o": ["16", "8", "4", "0"], "a": 1, "e": "Min at (2, 2): 4 + 4 = 8."}, {"s": "Math", "t": "Constrained Optimization, Convexity and Extrema", "q": "A function f is convex if:", "o": ["f(x + y) = f(x) + f(y)", "f(x) ≥ 0 for all x", "f′(x) = 0 everywhere", "f(tx + (1 − t)y) ≤ t f(x) + (1 − t) f(y)"], "a": 3, "e": "The chord lies above the graph."}, {"s": "Math", "t": "Constrained Optimization, Convexity and Extrema", "q": "The sum of two convex functions is:", "o": ["Convex", "Not necessarily convex", "Concave", "Always linear"], "a": 0, "e": "Convexity is preserved under addition."}, {"s": "Math", "t": "Constrained Optimization, Convexity and Extrema", "q": "Which function is NOT convex on all of R?", "o": ["f(x) = eˣ", "f(x) = x⁴", "f(x) = x³", "f(x) = |x|"], "a": 2, "e": "f″(x) = 6x changes sign."}, {"s": "Math", "t": "Constrained Optimization, Convexity and Extrema", "q": "A local minimum of a convex function is:", "o": ["Also a global minimum", "Never a minimum", "A maximum", "Always a saddle"], "a": 0, "e": "Convexity rules out separate local minima."}, {"s": "Math", "t": "Constrained Optimization, Convexity and Extrema", "q": "The Hessian of f(x, y) = x² + y² is:", "o": ["Zero", "Positive definite, so f is strictly convex", "Negative definite", "Indefinite"], "a": 1, "e": "Hessian is 2I."}, {"s": "Math", "t": "Constrained Optimization, Convexity and Extrema", "q": "Differentiating the Lagrangian with respect to λ gives:", "o": ["The gradient of f", "The Hessian", "The constraint g = 0", "The learning rate"], "a": 2, "e": "∂ℒ/∂λ = g."}, {"s": "Math", "t": "Constrained Optimization, Convexity and Extrema", "q": "The function f(x) = −x² is:", "o": ["Concave", "Linear", "Convex", "Periodic"], "a": 0, "e": "f″ = −2 < 0."}, {"s": "Math", "t": "Constrained Optimization, Convexity and Extrema", "q": "For f(x, y) = x² − y², the Hessian eigenvalues are:", "o": ["0 and 0", "2 and −2", "−2 and −2", "2 and 2"], "a": 1, "e": "Hessian = diag(2, −2), indefinite, so (0, 0) is a saddle."}, {"s": "AI", "t": "AI Definitions and Foundations", "q": "'Acting rationally' defines AI as building an agent that:", "o": ["Reasons only with Aristotelian logic", "Does the best thing it can, given what it knows", "Models the actual workings of the brain", "Behaves exactly like a human"], "a": 1, "e": "The rational-agent view targets the best expected outcome, not human imitation."}, {"s": "AI", "t": "AI Definitions and Foundations", "q": "Which of the four definitions of AI is the Turing Test linked to?", "o": ["Acting rationally", "Thinking rationally", "Acting humanly", "Thinking humanly"], "a": 2, "e": "The test judges only behaviour, never the internal process."}, {"s": "AI", "t": "AI Definitions and Foundations", "q": "'Thinking humanly' corresponds to which field?", "o": ["Control theory", "Database design", "Formal logic", "Cognitive science"], "a": 3, "e": "It tries to model the brain's actual process, mistakes included."}, {"s": "AI", "t": "AI Definitions and Foundations", "q": "'Thinking rationally' reasons by:", "o": ["Trial and error only", "Correct logic, as in Aristotle's syllogisms", "Copying human mistakes", "Maximizing a reward"], "a": 1, "e": "The logic camp fails on messy worlds (birds can fly, but penguins...)."}, {"s": "AI", "t": "AI Definitions and Foundations", "q": "Why is the 'acting rationally' view preferred?", "o": ["It copies human limitations", "It is more general and more measurable", "It requires no data", "It always gives perfect decisions"], "a": 1, "e": "A rational agent can use reflexes, logic or learning, and performance can be given a number."}, {"s": "AI", "t": "AI Definitions and Foundations", "q": "Rational does NOT mean:", "o": ["Maximizing expected performance", "Acting well given the percepts", "Perfect or omniscient", "Making the best decision with available information"], "a": 2, "e": "Rational means best given the information you had. Bad luck is not bad judgement."}, {"s": "AI", "t": "AI Definitions and Foundations", "q": "Which relation between the three terms is correct?", "o": ["AI ⊂ Machine learning ⊂ Deep learning", "Machine learning ⊂ Deep learning ⊂ AI", "Deep learning ⊂ Machine learning ⊂ AI", "They are the same"], "a": 2, "e": "Deep learning is a kind of ML, and ML is one approach to AI."}, {"s": "AI", "t": "AI Definitions and Foundations", "q": "A rule-based expert system is:", "o": ["AI but not machine learning", "Deep learning", "Machine learning but not AI", "Neither AI nor ML"], "a": 0, "e": "It shows intelligent behaviour but does not learn from data."}, {"s": "AI", "t": "AI Definitions and Foundations", "q": "Traditional programming takes ______ and produces answers, while machine learning takes ______ and produces rules.", "o": ["Answers only; rules only", "Rules + answers; data only", "Data + answers; rules + data", "Rules + data; data + answers"], "a": 3, "e": "ML learns the rules from labelled examples."}, {"s": "AI", "t": "AI Definitions and Foundations", "q": "Polanyi's paradox says that:", "o": ["Machines cannot learn", "Experts always explain their rules", "We know more than we can tell", "Computers know more than people"], "a": 2, "e": "Tacit knowledge is hard to write as rules, which is why ML learns from examples."}, {"s": "AI", "t": "AI Definitions and Foundations", "q": "'AI is whatever hasn't been done yet' means:", "o": ["Once a problem is solved, it stops being called AI", "AI can never solve anything", "AI cannot be defined", "AI is only about the future"], "a": 0, "e": "Solved problems (chess, route finding) become 'just software'."}, {"s": "AI", "t": "AI Definitions and Foundations", "q": "Which of these is an example of AI that learns from interaction rather than fixed rules?", "o": ["A pocket calculator", "A sorting routine", "A spam filter trained on labelled emails", "A fixed IF–THEN thermostat"], "a": 2, "e": "A spam filter learns patterns from data."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "The Turing Machine was proposed in:", "o": ["1943", "1956", "1950", "1936"], "a": 3, "e": "It was Turing's model of what computing means."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "A Turing Machine consists of:", "o": ["A neural network", "A tape, a head, a state and a rulebook", "A CPU, RAM and disk", "A database and a compiler"], "a": 1, "e": "It reads and writes one tape cell at a time following rules."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "The Church–Turing thesis states that:", "o": ["Anything computable by a step-by-step procedure is computable by a Turing Machine", "Machines can think", "Computers are faster than humans", "All problems are solvable by computers"], "a": 0, "e": "Your laptop and the clerk differ in speed, not capability."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "The Universal Turing Machine shows that:", "o": ["A program is just data that another machine can read and run", "Memory is unlimited", "Every problem is solvable", "Machines can be conscious"], "a": 0, "e": "One machine can imitate any other by reading its rulebook."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "The Halting Problem shows:", "o": ["Faster computers solve all problems", "Some problems cannot be solved by any computer", "All programs eventually halt", "Search is always complete"], "a": 1, "e": "It is impossible, not merely hard."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "The Turing Test (Imitation Game) was proposed in:", "o": ["1966", "1950", "1980", "1936"], "a": 1, "e": "Turing swapped 'Can machines think?' for a testable behavioural question."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "In the Turing Test the machine passes if:", "o": ["The judge cannot do better than guessing which is the machine", "It has consciousness", "It solves a maths problem", "It beats a human at chess"], "a": 0, "e": "The judge converses by text with a hidden human and a hidden machine."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "Turing predicted that in about 50 years an average judge would have no more than ______ chance of identifying the machine after five minutes.", "o": ["50%", "90%", "70%", "10%"], "a": 2, "e": "A modest bar: five minutes and 70%."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "Searle's Chinese Room argues that:", "o": ["Machines can learn Chinese", "Manipulating symbols by rules (syntax) is not enough for understanding (semantics)", "The Turing Test is a perfect test", "Rule books are always incomplete"], "a": 1, "e": "Passing the test proves nothing about understanding."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "The 'systems reply' to the Chinese Room says:", "o": ["Understanding, if present, lies in the whole system, not in the person alone", "Rulebooks cannot be written", "The person truly understands Chinese", "Computers have neurons"], "a": 0, "e": "No single neuron understands English either."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "The ELIZA program (Weizenbaum, 1966) worked mainly by:", "o": ["Learning from a large corpus", "Logical theorem proving", "Deep neural networks", "Keyword matching and turning sentences into questions"], "a": 3, "e": "It had no understanding at all."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "The 'ELIZA effect' is:", "o": ["A speed-up in search", "People attributing understanding and care to systems that have none", "A bug in chatbots", "A method of training"], "a": 1, "e": "Even the author's secretary wanted privacy with it."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "CAPTCHA is best described as:", "o": ["A search algorithm", "A test machines use to learn", "A reverse Turing Test where a machine judges whether you are human", "A programming language"], "a": 2, "e": "It stands for Completely Automated Public Turing test to tell Computers and Humans Apart."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "One reason the Turing Test has fallen out of favour is that it:", "o": ["Needs no judge", "Rewards deception and human-likeness", "Cannot be run on computers", "Is too hard for humans"], "a": 1, "e": "A capable machine must pretend to be bad at arithmetic to pass."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "Moravec's paradox observes that:", "o": ["Tasks easy for humans (perception, movement) are hard for machines, and vice versa", "Humans are best at arithmetic", "Machines are bad at all tasks", "Chess is harder than vision"], "a": 0, "e": "Evolution perfected vision and movement over hundreds of millions of years."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "Which task is hard for humans but easy for machines (Moravec)?", "o": ["Walking on uneven ground", "Arithmetic on enormous numbers", "Recognising a face in a crowd", "Picking up a ripe tomato"], "a": 1, "e": "Abstract reasoning is a thin recent layer in humans."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "The McCulloch & Pitts neuron (1943) is the ancestor of:", "o": ["Every neural network", "Expert systems", "Prolog", "Search engines"], "a": 0, "e": "Inputs, weights and a firing threshold."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "The term 'artificial intelligence' was coined by McCarthy at the:", "o": ["Stanford meeting, 1980", "Turing symposium, 1950", "Dartmouth workshop, 1956", "MIT lab, 1966"], "a": 2, "e": "The proposal expected big progress in one summer."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "The first AI winter (1969–73) was triggered by:", "o": ["Perceptrons' inability to learn XOR and the Lighthill Report", "The success of ImageNet", "The EU AI Act", "The invention of GPUs"], "a": 0, "e": "Funding collapsed after promises went unmet."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "XCON (R1), a famous expert system, was used at:", "o": ["NASA for navigation", "IBM for chess", "DEC to configure computer orders", "Google for search"], "a": 2, "e": "It reportedly saved tens of millions a year."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "IBM's Deep Blue beat Kasparov in 1997 mainly through:", "o": ["Learning from self-play", "Natural language processing", "Brute-force search with a hand-tuned evaluation", "Deep learning"], "a": 2, "e": "It did not learn chess."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "The modern deep learning era is usually dated from:", "o": ["Dartmouth in 1956", "Deep Blue in 1997", "AlexNet winning ImageNet in 2012", "ELIZA in 1966"], "a": 2, "e": "Deep networks began winning image tasks."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "The Transformer architecture, behind modern LLMs, appeared in:", "o": ["2017", "2012", "1986", "2022"], "a": 0, "e": "AlphaGo came in 2016 and ChatGPT in Nov 2022."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "Which is NOT one of the three reasons deep learning took off around 2012?", "o": ["Large labelled datasets (data)", "Algorithmic refinements", "The invention of the Turing Machine", "GPUs (compute)"], "a": 2, "e": "Data, compute and refinements together made it work."}, {"s": "AI", "t": "Turing, History and Milestones", "q": "Why did the second AI winter (late 1980s) occur?", "o": ["Turing tests failed", "Expert systems were brittle, unmaintainable and could not learn", "Neural networks were banned", "GPUs were too expensive"], "a": 1, "e": "This is why machine learning took over."}, {"s": "AI", "t": "AI Systems and Current Trends", "q": "Which is the correct pipeline of an AI system?", "o": ["Learning → sensors → decision", "Sensors → perception → knowledge → reasoning/learning → decision → action", "Action → perception → sensors", "Data → action → knowledge"], "a": 1, "e": "The result feeds back to the start, forming a loop."}, {"s": "AI", "t": "AI Systems and Current Trends", "q": "A system that acts without looking again at the result is:", "o": ["Open-loop and cannot correct itself", "Model-based", "Rational by definition", "Closed-loop"], "a": 0, "e": "The feedback loop is the point."}, {"s": "AI", "t": "AI Systems and Current Trends", "q": "Compared with connectionist AI, symbolic AI (GOFAI) is:", "o": ["A black box needing huge data", "Unable to use rules", "Readable and explainable but brittle on unseen cases", "Based only on neural networks"], "a": 2, "e": "Symbolic AI uses hand-written rules and logic."}, {"s": "AI", "t": "AI Systems and Current Trends", "q": "Neuro-symbolic AI combines:", "o": ["Two neural networks", "Search with databases", "Rules with random numbers", "Neural networks for perception with symbolic reasoning that can be checked"], "a": 3, "e": "A network perceives; a symbolic layer reasons."}, {"s": "AI", "t": "AI Systems and Current Trends", "q": "A large language model fundamentally:", "o": ["Searches a graph", "Stores facts in a database", "Predicts the next token", "Executes logic programs"], "a": 2, "e": "Pretraining → fine-tuning → RLHF."}, {"s": "AI", "t": "AI Systems and Current Trends", "q": "LLM hallucinations occur because:", "o": ["It uses symbolic rules", "The objective is plausible text, not true text", "It has no training data", "The model is too small"], "a": 1, "e": "It is trained to produce likely continuations."}, {"s": "AI", "t": "AI Systems and Current Trends", "q": "Retrieval-Augmented Generation (RAG):", "o": ["Trains a model from scratch", "Generates random text", "Looks facts up first, then writes the answer", "Removes the need for data"], "a": 2, "e": "It is a direct answer to hallucination."}, {"s": "AI", "t": "AI Systems and Current Trends", "q": "A multimodal model can:", "o": ["Only classify images", "Only play games", "Process text, images and audio in one model", "Only process text"], "a": 2, "e": "The same system can read a chart and answer in words."}, {"s": "AI", "t": "AI Systems and Current Trends", "q": "An AI 'agent' in current trends is a model that:", "o": ["Has no goals", "Takes actions and uses tools rather than only answering", "Only stores data", "Is a database"], "a": 1, "e": "The definition of agent dates to 1995."}, {"s": "AI", "t": "AI Systems and Current Trends", "q": "Small on-device models are attractive mainly for:", "o": ["Training on more data", "Privacy, latency and cost", "More energy use", "Larger scale"], "a": 1, "e": "They are the opposite pull from frontier scale."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "In the Amazon hiring-tool case the model downgraded CVs with 'women's' because:", "o": ["It learned from historical hiring data that was mostly male", "Engineers wrote a sexist rule", "The CVs were poorly formatted", "It had too little data"], "a": 0, "e": "A model learns what is in the data, not what is right."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "'A model is not a judge, it is a mirror' means:", "o": ["It reflects the patterns of the data it was trained on", "It cannot be biased", "It is objective and neutral", "It ignores history"], "a": 0, "e": "A model trained on history reflects history back."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "Historical bias occurs when:", "o": ["The data is accurate but the world was unfair", "The model is too complex", "The sample is too small", "The test set is biased"], "a": 0, "e": "Example: a CCTV recording shows few people admitted because the guard turned them away."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "Testing a drug only on men aged 20–40 and prescribing it to everyone is:", "o": ["Deployment bias", "Representation bias", "Measurement bias", "Aggregation bias"], "a": 1, "e": "The sample is not the population."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "Using attendance as a proxy for 'does this student care' is:", "o": ["Historical bias", "Evaluation bias", "Measurement bias", "Representation bias"], "a": 2, "e": "A proxy was measured, not the real thing."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "Using one model for genuinely different groups is:", "o": ["Aggregation bias", "Deployment bias", "Representation bias", "Historical bias"], "a": 0, "e": "Like one-size-fits-all clothing."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "A test set that shares the training data's blind spot causes:", "o": ["Measurement bias", "Aggregation bias", "Evaluation bias", "Deployment bias"], "a": 2, "e": "The test cannot reveal the failure."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "A tool built to help a judge think becomes a rubber stamp. This is:", "o": ["Deployment bias", "Historical bias", "Aggregation bias", "Representation bias"], "a": 0, "e": "Fine for its purpose, then used for another."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "'Fairness through unawareness' (deleting gender and caste columns) fails because:", "o": ["It is illegal", "It improves accuracy", "Other features act as proxies and the columns are needed to audit", "It makes the model too slow"], "a": 2, "e": "Surname, pincode and school leak the information."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "In the COMPAS controversy, ProPublica argued about unequal ______, while Northpointe argued ______.", "o": ["Recall; recall", "Accuracy; precision", "False positive rates; calibration", "Prior; posterior"], "a": 2, "e": "Both were right on different definitions."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "When base rates differ between groups, it is impossible to satisfy:", "o": ["Any definition of fairness", "Calibration and equal error rates at the same time", "Accuracy and speed", "Precision only"], "a": 1, "e": "This is a theorem, not a limitation of technology."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "Demographic parity requires:", "o": ["The same percentage selected from each group", "Removing group labels", "Equal error rates across groups", "A score meaning the same for everyone"], "a": 0, "e": "It may select less-qualified candidates from one group."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "Equalized odds requires:", "o": ["No sensitive attributes", "The same error rates across groups", "The same selection rate", "Calibrated scores"], "a": 1, "e": "Its cost is that a score may mean different things for different groups."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "Calibration means:", "o": ["Equal selection rates", "Removing bias from data", "Equal false positive rates", "A score of 0.8 means an 80% chance for everyone"], "a": 3, "e": "It can leave the error burden unequal."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "According to the slides, fairness is best described as:", "o": ["A value judgement made explicit by the people affected", "A property computed by an algorithm", "Solved by deleting columns", "A purely technical metric"], "a": 0, "e": "Do not quietly pick one definition and hide it in code."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "LIME, SHAP and saliency maps are tools for:", "o": ["Training faster", "Compressing models", "Collecting data", "Explaining model predictions"], "a": 3, "e": "They give plausible, not guaranteed, explanations."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "In the wolf vs husky example, the classifier actually detected:", "o": ["Ear shape", "Eye colour", "Fur colour", "Snow in the background"], "a": 3, "e": "It was an excellent snow detector."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "The higher the stakes for an individual, the stronger the case for:", "o": ["Removing human oversight", "An interpretable model", "More hidden features", "A larger black box"], "a": 1, "e": "Film recommendations can use a black box; denying bail should not."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "Humans over-trusting automated systems against their own judgement is called:", "o": ["Automation bias", "Confirmation bias", "Algorithmic transparency", "Selection bias"], "a": 0, "e": "Example: following a satnav into a river."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "In 'human in the loop' oversight:", "o": ["A person approves each decision before it takes effect", "No human is involved", "A person decides whether to use the system", "A person only monitors"], "a": 0, "e": "'On the loop' monitors; 'in command' decides whether the system runs."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "'Human on the loop' means:", "o": ["The system acts while a person monitors and can intervene", "A person approves every decision", "The system is switched off", "A person writes all rules"], "a": 0, "e": "Contrast with in the loop and in command."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "'Human in command' means:", "o": ["The model decides alone", "A person labels the data", "A person decides whether the system is used at all and can shut it down", "A person approves each prediction"], "a": 2, "e": "It is the highest level of oversight."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "Combining pincode, date of birth and sex to identify individuals is a ______ problem.", "o": ["Calibration", "Aggregation", "Re-identification", "Memorization"], "a": 2, "e": "Each jigsaw piece shows nothing; assembled, the picture is obvious."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "A model deducing facts you never disclosed from shopping or typing patterns is a ______ privacy problem.", "o": ["Re-identification", "Memorization", "Consent", "Inference"], "a": 3, "e": "You never shared it, but the system derived it."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "Large models regurgitating verbatim training data, including personal information, is:", "o": ["Aggregation", "Calibration", "Memorization", "Inference"], "a": 2, "e": "It is the fourth of the four privacy problems."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "Small invisible noise flipping a classifier's answer is called:", "o": ["Data leakage", "Overfitting", "An adversarial example", "A hallucination"], "a": 2, "e": "Stickers on a stop sign can make a vision system misread it."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "A boat-racing agent looping to hit respawning targets for points illustrates:", "o": ["Calibration", "Transfer learning", "Specification gaming", "Overfitting"], "a": 2, "e": "It optimized what was said, not what was meant."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "Goodhart's Law states:", "o": ["More data always helps", "When a measure becomes a target, it ceases to be a good measure", "All models overfit", "Fairness cannot be computed"], "a": 1, "e": "Example: a school stops weak students from sitting the exam to raise its pass percentage."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "The 'liar's dividend' refers to:", "o": ["Genuine evidence being dismissed as a deepfake", "Money made by deepfake creators", "Fake videos going viral", "Cloned voices of family"], "a": 0, "e": "The technology gives cover to the guilty."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "Under the EU AI Act, government social scoring is in which risk tier?", "o": ["Limited", "Minimal", "High", "Unacceptable (banned)"], "a": 3, "e": "Four tiers: unacceptable, high, limited, minimal."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "Under the EU AI Act, AI used for recruitment, credit and policing is classed as:", "o": ["Unacceptable", "High risk", "Minimal", "Limited"], "a": 1, "e": "High-risk systems carry heavy obligations."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "Under the EU AI Act, chatbots must disclose that they are AI. That is the ______ tier.", "o": ["Limited risk", "Unacceptable", "High", "Minimal"], "a": 0, "e": "Limited risk means transparency obligations."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "Spam filters and game AI fall under which EU AI Act tier?", "o": ["High", "Minimal risk", "Unacceptable", "Limited"], "a": 1, "e": "Nothing special is required."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "India's AI governance guidelines (MeitY) are described as:", "o": ["A ban on generative AI", "A copy of the EU AI Act", "A single strict AI law", "Techno-legal and lighter-touch, relying largely on existing laws"], "a": 3, "e": "Voluntary compliance, self-certification and sandboxes over mandates."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "Which is NOT one of the seven 'sutras' of India's AI governance guidelines?", "o": ["Transparency", "Safety and reliability", "Accountability", "Maximum profit"], "a": 3, "e": "The sutras include safety, equality, inclusivity, privacy, transparency, accountability and protection of societal values."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "The Responsible AI action for 'Fairness' is to:", "o": ["Maximize overall accuracy", "Report metrics broken down by subgroup and state which definition you chose", "Remove sensitive columns", "Use only black boxes"], "a": 1, "e": "Principles must become actions."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "The ATM example shows that AI usually changes jobs by:", "o": ["Replacing managers only", "Automating tasks while the job itself changes", "Creating no new roles", "Eliminating all jobs at once"], "a": 1, "e": "Every job is a bundle of tasks; tellers moved toward sales and relationships."}, {"s": "AI", "t": "Ethics, Bias and Fairness", "q": "Training a frontier model needs capital and compute only a handful of organizations have. This raises the issue of:", "o": ["Adversarial noise", "Overfitting", "Data leakage", "Concentration of power"], "a": 3, "e": "It shifts who shapes a general-purpose technology."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "An agent perceives its environment through ______ and acts through ______.", "o": ["Data; labels", "Rules; goals", "Sensors; actuators", "Actuators; sensors"], "a": 2, "e": "A software agent reads a file (percept) and writes a file (action)."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "The sensors of a spam filter are:", "o": ["The incoming email", "A temperature probe", "A camera", "Wheels and brush"], "a": 0, "e": "Its actuators move mail to Spam or leave it in the inbox."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "A percept sequence is:", "o": ["The agent's actions", "Everything the agent has perceived so far", "The performance measure", "A single snapshot"], "a": 1, "e": "A percept is one snapshot."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "The agent function is the mapping:", "o": ["P* → A (percept sequences to actions)", "A → P", "P → P*", "A* → P*"], "a": 0, "e": "It is an abstract, essentially infinite lookup table."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "An agent is made up of:", "o": ["Goals + rules", "Architecture + program", "Sensors + data", "Memory + utility"], "a": 1, "e": "The program implements the agent function on physical hardware."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "PEAS stands for:", "o": ["Performance, Environment, Actuators, Sensors", "Planning, Execution, Action, Search", "Performance, Evidence, Agent, Sensor", "Perception, Evaluation, Action, State"], "a": 0, "e": "It specifies the task environment."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "Which is a sensor of a self-driving taxi?", "o": ["Brake", "Steering", "LIDAR", "Horn"], "a": 2, "e": "Steering, accelerator, brake and horn are actuators."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "The performance measure should be designed around:", "o": ["The agent's code", "The agent's internal state", "The state of the environment you want", "The behaviour you expect from the agent"], "a": 2, "e": "Reward 'floor is clean', not 'dirt collected', which can be gamed."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "Rationality depends on all of these EXCEPT:", "o": ["The performance measure", "The actual outcome of the action", "The percept sequence so far", "The agent's prior knowledge"], "a": 1, "e": "It depends on four things: measure, prior knowledge, actions available, percept sequence."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "Which environment is fully observable?", "o": ["Poker", "Driving behind a lorry", "Mumbai traffic", "Sudoku"], "a": 3, "e": "In poker you cannot see the opponents' cards."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "Partial observability forces an agent to have:", "o": ["A faster CPU", "More actuators", "Memory (internal state)", "No goals"], "a": 2, "e": "It must hold a belief about what it cannot currently see."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "Classifying each photo independently is an example of an ______ environment.", "o": ["Sequential", "Continuous", "Dynamic", "Episodic"], "a": 3, "e": "Episodic needs no lookahead."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "Chess and driving are examples of ______ environments.", "o": ["Sequential", "Static only", "Episodic", "Single-agent"], "a": 0, "e": "Sequential is why search exists."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "A crossword is an example of a ______ environment.", "o": ["Stochastic", "Dynamic", "Static", "Continuous"], "a": 2, "e": "The world does not change while you think."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "Driving a car is best described as:", "o": ["Partially observable, multi-agent, stochastic, sequential, dynamic, continuous", "Episodic and static", "Fully observable and deterministic", "Single-agent and discrete"], "a": 0, "e": "Driving takes the hard option on every row."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "'Known' versus 'observable' environments differ because:", "o": ["They are the same", "Known means stochastic", "Observable = access to the state; known = knowledge of the rules", "Observable means deterministic"], "a": 2, "e": "You can have a known but partially observable game (poker)."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "In a multi-agent competitive environment, ______ can become rational.", "o": ["Fixed rules only", "Randomization", "Doing nothing", "Ignoring percepts"], "a": 1, "e": "A predictable agent can be exploited."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "A simple reflex agent selects actions using:", "o": ["Condition–action rules on the current percept", "A goal and lookahead", "Memory of all past percepts", "A utility function"], "a": 0, "e": "It has no memory."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "A simple reflex agent works well only when the environment is:", "o": ["Unknown", "Partially observable", "Dynamic", "Fully observable"], "a": 3, "e": "Hide anything relevant and it fails."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "A vacuum agent with no location sensor and a fixed 'if clean, move right' rule will:", "o": ["Clean everything", "Loop forever at the wall", "Find the dirt", "Stop at once"], "a": 1, "e": "Randomizing the move escapes the loop with no memory."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "What does a model-based reflex agent add over a simple reflex agent?", "o": ["Internal state with transition and sensor models", "A utility function", "A goal", "A critic"], "a": 0, "e": "It holds a belief about what it cannot see."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "The transition model describes:", "o": ["The performance measure", "The agent's goals", "How the world appears in percepts", "How the world changes in response to actions"], "a": 3, "e": "The sensor model describes how the world shows up in percepts."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "A goal-based agent differs from a reflex agent because it:", "o": ["Has no memory", "Uses only rules", "Never plans", "Simulates what will happen if it does an action"], "a": 3, "e": "Change the goal and its behaviour changes without rewriting rules."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "A goal-based agent cannot:", "o": ["Use a model", "Reach a goal", "Use lookahead", "Choose between different ways of succeeding"], "a": 3, "e": "Goals are pass/fail; this is why utility agents exist."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "Route A takes 20 min with probability 0.6 and 90 min otherwise; Route B takes 35 min for sure. A utility-based agent minimizing expected time chooses:", "o": ["Neither", "They are equal", "Route A (20 min)", "Route B (35 vs 48 min expected)"], "a": 3, "e": "Expected time A = 0.6×20 + 0.4×90 = 48 min."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "A utility-based agent picks the action with the highest:", "o": ["Immediate reward only", "Expected utility", "Number of steps", "Heuristic value h"], "a": 1, "e": "Utility is the probability-weighted average desirability."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "Between ₹5,000 guaranteed and a 50% chance of ₹12,000, the expected value of the gamble is:", "o": ["₹12,000", "₹6,000", "₹3,000", "₹5,000"], "a": 1, "e": "0.5 × 12,000 = 6,000. Many still choose ₹5,000 because utility is not money."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "Which is NOT one of the four components of a learning agent?", "o": ["Critic", "Performance element", "Problem generator", "Sensor model"], "a": 3, "e": "The four parts are performance element, critic, learning element and problem generator."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "In a learning agent the critic:", "o": ["Chooses actions", "Suggests exploratory actions", "Changes the program", "Judges results against a fixed external standard"], "a": 3, "e": "If the agent could rewrite its own standard, it would lower the bar."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "The problem generator in a learning agent:", "o": ["Judges performance", "Executes the best action", "Stores the knowledge base", "Suggests exploratory, possibly suboptimal actions"], "a": 3, "e": "Ordering a new dish occasionally is how you find a better one."}, {"s": "AI", "t": "Intelligent Agents, PEAS and Environments", "q": "The learning element:", "o": ["Defines the goal", "Selects exploration", "Perceives the world", "Modifies the performance element using feedback from the critic"], "a": 3, "e": "The student revising their driving habits."}, {"s": "AI", "t": "Problem Formulation and Knowledge Representation", "q": "Which is NOT one of the five parts of a search problem?", "o": ["Heuristic function", "Transition model", "Goal test", "Initial state"], "a": 0, "e": "The five are initial state, actions, transition model, goal test and path cost."}, {"s": "AI", "t": "Problem Formulation and Knowledge Representation", "q": "The path cost of a solution:", "o": ["Decides which of several solutions is best", "Defines the goal", "Is the number of states", "Is the same for every path"], "a": 0, "e": "Cost may be distance, time, money or moves."}, {"s": "AI", "t": "Problem Formulation and Knowledge Representation", "q": "In a state-space graph, states are ______ and actions are ______.", "o": ["Paths; costs", "Nodes; edges", "Goals; rules", "Edges; nodes"], "a": 1, "e": "A solution is a path from start to goal."}, {"s": "AI", "t": "Problem Formulation and Knowledge Representation", "q": "'Abstraction' in problem formulation means:", "o": ["Using logic only", "Choosing what detail to throw away", "Adding more detail", "Removing the goal"], "a": 1, "e": "A route-finding state is just the city you are in."}, {"s": "AI", "t": "Problem Formulation and Knowledge Representation", "q": "In a semantic network, 'Sparrow is-a Bird' and 'Bird has Wings' lets you infer:", "o": ["A sparrow is a mammal", "Birds are sparrows", "A sparrow has wings (inheritance)", "Nothing"], "a": 2, "e": "Inheritance comes free."}, {"s": "AI", "t": "Problem Formulation and Knowledge Representation", "q": "Frames are:", "o": ["IF–THEN pairs", "Logical formulas", "Slot-and-filler structures with default values", "Graphs of states"], "a": 2, "e": "Essentially forms, with defaults until something fills a slot."}, {"s": "AI", "t": "Problem Formulation and Knowledge Representation", "q": "Production rules are:", "o": ["IF–THEN pairs, the basis of expert systems", "Slot-filler forms", "Labelled graph links", "Probability tables"], "a": 0, "e": "Easy to write and read."}, {"s": "AI", "t": "Problem Formulation and Knowledge Representation", "q": "Ontologies and knowledge graphs are best described as:", "o": ["Small rule sets", "Semantic networks at industrial scale with a formal vocabulary", "Neural networks", "Sorting algorithms"], "a": 1, "e": "This is how a search engine knows a query names a person."}, {"s": "AI", "t": "Problem Formulation and Knowledge Representation", "q": "A sensorless (conformant) problem is solved by searching over:", "o": ["Goal states only", "Single states", "Belief states (sets of possible states)", "Percepts"], "a": 2, "e": "You need a plan that works from every possible start state."}, {"s": "AI", "t": "Problem Formulation and Knowledge Representation", "q": "A contingency problem has a solution that is:", "o": ["Always empty", "A fixed sequence", "A single state", "A tree with branches (if–then plans)"], "a": 3, "e": "For example: go there; if the door is locked, do this instead."}, {"s": "AI", "t": "Problem Formulation and Knowledge Representation", "q": "An exploration problem is one where:", "o": ["The environment is episodic", "The state space itself is unknown", "There is no goal", "The state space is fully known"], "a": 1, "e": "You must act in the real world to discover it."}, {"s": "AI", "t": "Problem Formulation and Knowledge Representation", "q": "A single-state problem requires the environment to be:", "o": ["Fully observable and deterministic", "Unknown", "Partially observable", "Stochastic"], "a": 0, "e": "Then a plan is a fixed sequence of actions."}, {"s": "AI", "t": "Uninformed and Informed Search", "q": "On the slide graph (edges S–A 2, S–B 3, A–C 9, A–D 1, B–D 2, B–E 2, C–G 9, D–G 6, E–G 2), the cheapest path from S to G costs:", "o": ["20", "11", "9", "7"], "a": 3, "e": "S → B → E → G = 3 + 2 + 2 = 7."}, {"s": "AI", "t": "Uninformed and Informed Search", "q": "BFS expands nodes using a:", "o": ["Priority queue by heuristic", "LIFO stack", "Priority queue by cost", "FIFO queue (nearest first)"], "a": 3, "e": "It expands the fewest-steps node first."}, {"s": "AI", "t": "Uninformed and Informed Search", "q": "BFS finds the cheapest path only if:", "o": ["The goal is near", "Every step costs the same", "A heuristic is used", "The graph is a tree"], "a": 1, "e": "It finds the fewest steps, not the lowest cost."}, {"s": "AI", "t": "Uninformed and Informed Search", "q": "DFS expands nodes using a:", "o": ["LIFO stack (deepest first)", "Priority queue by cost", "Priority queue by f", "FIFO queue"], "a": 0, "e": "It always expands the newest (deepest) node."}, {"s": "AI", "t": "Uninformed and Informed Search", "q": "On the slide graph, BFS returns S→A→C→G, whose cost is:", "o": ["9", "7", "11", "20"], "a": 3, "e": "2 + 9 + 9 = 20, versus the optimal 7."}, {"s": "AI", "t": "Uninformed and Informed Search", "q": "Uniform Cost Search expands the node with the lowest:", "o": ["Heuristic h", "Depth", "Path cost c from the start", "Number of children"], "a": 2, "e": "It is guaranteed to find the cheapest path."}, {"s": "AI", "t": "Uninformed and Informed Search", "q": "Uniform Cost Search declares victory when:", "o": ["The frontier is empty", "Depth reaches the goal", "The goal is removed from the frontier", "The goal is first generated"], "a": 2, "e": "On the slide, G was seen at cost 9 but later replaced by cost 7."}, {"s": "AI", "t": "Uninformed and Informed Search", "q": "Greedy Best-First Search expands the node with the lowest:", "o": ["Heuristic value h", "Depth", "f = c + h", "Path cost c"], "a": 0, "e": "It always expands what looks closest to the goal."}, {"s": "AI", "t": "Uninformed and Informed Search", "q": "A* expands the node with the lowest:", "o": ["c − h", "h only", "f = c + h", "c only"], "a": 2, "e": "c is cost so far and h the estimate of what is left."}, {"s": "AI", "t": "Uninformed and Informed Search", "q": "On the slide graph, the first node A* expands after S (h: A = 7, B = 4) is:", "o": ["E", "D", "B (f = 7, versus A with f = 9)", "A (f = 9)"], "a": 2, "e": "f(B) = 3 + 4 = 7 and f(A) = 2 + 7 = 9."}, {"s": "AI", "t": "Uninformed and Informed Search", "q": "A* is guaranteed to find an optimal solution if its heuristic is:", "o": ["Always large", "Random", "Always zero", "Admissible (never overestimates)"], "a": 3, "e": "Admissible means h ≤ true remaining cost."}, {"s": "AI", "t": "Uninformed and Informed Search", "q": "Which search uses ONLY the heuristic and ignores cost so far?", "o": ["Greedy Best-First Search", "A*", "BFS", "Uniform Cost Search"], "a": 0, "e": "It can be fast but is not guaranteed optimal."}, {"s": "AI", "t": "Uninformed and Informed Search", "q": "If h(n) = 0 for every node, A* behaves like:", "o": ["DFS", "Greedy search", "Hill climbing", "Uniform Cost Search"], "a": 3, "e": "f = c, so it expands by cost so far."}, {"s": "AI", "t": "Uninformed and Informed Search", "q": "Which search has the lowest memory requirement in general?", "o": ["Uniform Cost Search", "A*", "BFS", "DFS"], "a": 3, "e": "DFS stores only a single path and siblings."}, {"s": "AI", "t": "Local, Parallel and Adversarial Search", "q": "Local search algorithms are used when:", "o": ["There is no goal", "Only the final good state matters, not the path", "The map is unknown", "The path is needed"], "a": 1, "e": "For timetables or factory layouts, memory drops to almost nothing."}, {"s": "AI", "t": "Local, Parallel and Adversarial Search", "q": "Hill climbing stops when:", "o": ["It reaches the goal", "The temperature is zero", "No neighbour is better than the current state", "The queue is empty"], "a": 2, "e": "It may stop at a local maximum."}, {"s": "AI", "t": "Local, Parallel and Adversarial Search", "q": "Which is NOT a trap of hill climbing?", "o": ["Local maximum", "Heuristic admissibility", "Ridge", "Plateau"], "a": 1, "e": "A plateau is flat ground; a ridge needs a diagonal climb."}, {"s": "AI", "t": "Local, Parallel and Adversarial Search", "q": "Simulated annealing sometimes accepts a worse move, with probability that:", "o": ["Is always zero", "Decreases as the temperature falls", "Increases as the temperature falls", "Is always one"], "a": 1, "e": "Early on it wanders; late on it behaves like hill climbing."}, {"s": "AI", "t": "Local, Parallel and Adversarial Search", "q": "Local beam search keeps:", "o": ["Only the goal", "k states and the best k successors of all of them together", "All states", "One state"], "a": 1, "e": "Risk: all k crowd into the same valley."}, {"s": "AI", "t": "Local, Parallel and Adversarial Search", "q": "Stochastic beam search picks successors:", "o": ["Always the worst", "Always the best", "Randomly, in proportion to quality", "By depth only"], "a": 2, "e": "This keeps the states spread out."}, {"s": "AI", "t": "Local, Parallel and Adversarial Search", "q": "Two main difficulties of parallel search are:", "o": ["Load balancing and duplicated work", "Heuristics and logic", "Cost and goals", "Memory and speed"], "a": 0, "e": "Branches are unequal in size, and two processors may reach the same state."}, {"s": "AI", "t": "Local, Parallel and Adversarial Search", "q": "The three stages of a search engine are:", "o": ["Parsing, compiling, linking", "Training, testing, deploying", "Crawling, indexing, ranking", "Reading, writing, deleting"], "a": 2, "e": "Crawling is BFS over the web graph."}, {"s": "AI", "t": "Local, Parallel and Adversarial Search", "q": "An inverted index maps:", "o": ["Each page to its rank", "Each page to its words", "Each URL to its owner", "Each word to the list of pages containing it"], "a": 3, "e": "Like the index at the back of a textbook."}, {"s": "AI", "t": "Local, Parallel and Adversarial Search", "q": "PageRank defines a page as important if:", "o": ["It has the most words", "Important pages link to it", "It was created first", "It has the most images"], "a": 1, "e": "The definition is circular and solved by iteration."}, {"s": "AI", "t": "Local, Parallel and Adversarial Search", "q": "A search engine differs from state-space search because:", "o": ["It searches only at query time", "Its crawl and index are built before any query arrives", "It uses no graph", "It never ranks"], "a": 1, "e": "At query time it is a lookup plus ranking."}, {"s": "AI", "t": "Local, Parallel and Adversarial Search", "q": "In minimax, the MAX player chooses the move with the:", "o": ["First value", "Average value", "Highest value among the MIN player's resulting values", "Lowest value"], "a": 2, "e": "MAX maximizes, MIN minimizes, assuming optimal opponents."}, {"s": "AI", "t": "Local, Parallel and Adversarial Search", "q": "Alpha–beta pruning:", "o": ["Gives the same result as minimax while exploring fewer nodes", "Works only for single-agent search", "Needs a heuristic", "Changes the minimax result"], "a": 0, "e": "It only prunes branches that cannot affect the decision."}, {"s": "AI", "t": "Local, Parallel and Adversarial Search", "q": "A MAX node has two MIN children with leaf values (3, 5) and (2, 9). The value at the root is:", "o": ["5", "3", "2", "9"], "a": 1, "e": "MIN values are 3 and 2; MAX picks 3."}, {"s": "AI", "t": "Local, Parallel and Adversarial Search", "q": "A constraint satisfaction problem (CSP) is defined by:", "o": ["States, actions and costs", "Rules and facts", "Variables, domains and constraints", "Layers and weights"], "a": 2, "e": "Examples: map colouring and N-Queens."}, {"s": "AI", "t": "Local, Parallel and Adversarial Search", "q": "The Travelling Salesman Problem is an example of:", "o": ["A CSP only", "Propositional logic", "A combinatorial optimization problem", "Supervised learning"], "a": 2, "e": "The number of tours explodes combinatorially."}, {"s": "AI", "t": "Logic and Logic Programming", "q": "Which of these is a proposition?", "o": ["What time is it?", "It is raining", "Please sit", "Close the door"], "a": 1, "e": "A proposition is true or false."}, {"s": "AI", "t": "Logic and Logic Programming", "q": "A statement true in every row of its truth table is a:", "o": ["Entailment", "Contradiction", "Tautology", "Satisfiable only"], "a": 2, "e": "Example: P ∨ ¬P."}, {"s": "AI", "t": "Logic and Logic Programming", "q": "P ∧ ¬P is a:", "o": ["Tautology", "Entailment", "Always satisfiable", "Contradiction"], "a": 3, "e": "It is false in every row."}, {"s": "AI", "t": "Logic and Logic Programming", "q": "A formula true in at least one row of its truth table is:", "o": ["A tautology only", "A contradiction", "Satisfiable", "Unsatisfiable"], "a": 2, "e": "A tautology is satisfiable, but not every satisfiable formula is a tautology."}, {"s": "AI", "t": "Logic and Logic Programming", "q": "The knowledge base entails α when:", "o": ["α is true in every case where everything known is true", "α is true in some case", "α is false", "The KB is empty"], "a": 0, "e": "This is the definition of entailment."}, {"s": "AI", "t": "Logic and Logic Programming", "q": "P → Q is false only when:", "o": ["P is false and Q is true", "Both are true", "P is true and Q is false", "Both are false"], "a": 2, "e": "An implication is false only if the premise holds and the conclusion fails."}, {"s": "AI", "t": "Logic and Logic Programming", "q": "P ↔ Q is true when:", "o": ["P is true", "P and Q differ", "P and Q have the same truth value", "Q is true"], "a": 2, "e": "It means 'if and only if'."}, {"s": "AI", "t": "Logic and Logic Programming", "q": "From P and P → Q, modus ponens concludes:", "o": ["P ∧ ¬Q", "¬P", "Q", "¬Q"], "a": 2, "e": "If it rains the ground gets wet; it rains; so the ground is wet."}, {"s": "AI", "t": "Logic and Logic Programming", "q": "Modus tollens: from ¬Q and P → Q, we conclude:", "o": ["Q", "¬P", "P ∨ Q", "P"], "a": 1, "e": "The ground is dry, so it did not rain."}, {"s": "AI", "t": "Logic and Logic Programming", "q": "Resolution from (P ∨ Q) and (¬Q ∨ R) concludes:", "o": ["Q ∨ ¬Q", "¬P ∨ ¬R", "P ∧ R", "P ∨ R"], "a": 3, "e": "Q and ¬Q cancel."}, {"s": "AI", "t": "Logic and Logic Programming", "q": "Resolution is ______ for propositional logic.", "o": ["Incomplete", "Complete", "Undecidable", "Probabilistic"], "a": 1, "e": "One rule applied repeatedly settles any entailment question."}, {"s": "AI", "t": "Logic and Logic Programming", "q": "Predicate (first-order) logic improves on propositional logic by adding:", "o": ["Objects, predicates, functions and quantifiers", "Only probabilities", "Only connectives", "Only truth tables"], "a": 0, "e": "Quantifiers ∀ and ∃ let one sentence cover all students."}, {"s": "AI", "t": "Logic and Logic Programming", "q": "'All students who study pass' is written in FOL as:", "o": ["∀x Studies(x) → Passes(x)", "∀x Studies(x) ∧ Passes(x)", "Studies → Passes", "∃x Studies(x) ∧ Passes(x)"], "a": 0, "e": "A universal quantifier with an implication."}, {"s": "AI", "t": "Logic and Logic Programming", "q": "In Prolog, the symbol ':-' means:", "o": ["And", "Or", "Not", "If"], "a": 3, "e": "A comma means 'and'."}, {"s": "AI", "t": "Logic and Logic Programming", "q": "In Prolog, parent(ram, shyam). is a:", "o": ["Variable", "Rule", "Query", "Fact"], "a": 3, "e": "Facts are simply true."}, {"s": "AI", "t": "Logic and Logic Programming", "q": "With parent(ram, shyam), parent(shyam, mohan), parent(shyam, geeta) and grandparent(X, Z) :- parent(X, Y), parent(Y, Z), the query grandparent(ram, X) gives:", "o": ["X = mohan ; X = geeta", "false", "X = ram", "X = shyam"], "a": 0, "e": "Ram's grandchildren are Mohan and Geeta."}, {"s": "AI", "t": "Logic and Logic Programming", "q": "Prolog answers queries using:", "o": ["Genetic algorithms", "Neural networks", "Forward chaining only", "Backward chaining, unification and backtracking"], "a": 3, "e": "It starts from the goal and works back to facts."}, {"s": "AI", "t": "Logic and Logic Programming", "q": "Matching a goal against a rule head and binding variables is called:", "o": ["Resolution", "Unification", "Chaining", "Backtracking"], "a": 1, "e": "Backtracking undoes bindings when a branch fails."}, {"s": "AI", "t": "Logic and Logic Programming", "q": "Prolog is an example of ______ programming.", "o": ["Imperative", "Declarative", "Object-oriented", "Assembly"], "a": 1, "e": "You state facts and rules, not the procedure."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "Which is NOT a component of a rule-based expert system?", "o": ["Inference engine", "Knowledge base", "Explanation facility", "Backpropagation layer"], "a": 3, "e": "The parts: knowledge base, inference engine, working memory, explanation facility, user interface."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "The key architectural insight of expert systems was:", "o": ["Using neural networks", "Merging rules and code", "Separating the knowledge base from the inference engine", "Removing the user interface"], "a": 2, "e": "Swap the knowledge base and the same engine diagnoses something else."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "Working memory in an expert system holds:", "o": ["The facts known about the current case", "The training data", "All rules", "The explanation text"], "a": 0, "e": "It starts nearly empty and fills as rules fire."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "MYCIN is known for diagnosing ______ and introducing ______.", "o": ["Blood infections; certainty factors", "Rashes; PageRank", "Cancer; neural networks", "Faults; Prolog"], "a": 0, "e": "DENDRAL inferred molecular structure."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "DENDRAL inferred:", "o": ["Molecular structure from mass spectrometry", "Computer orders", "Blood infections", "Chess moves"], "a": 0, "e": "It was the first big expert system success."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "The 'knowledge acquisition bottleneck' refers to:", "o": ["Not enough memory", "Too many users", "Experts often cannot state how they know", "Slow processors"], "a": 2, "e": "Polanyi's paradox applied to building rules."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "Which was NOT a reason expert systems failed?", "o": ["Brittleness", "Knowledge acquisition bottleneck", "They could not learn", "They required too many GPUs"], "a": 3, "e": "They also became unmaintainable at scale."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "Supervised learning uses:", "o": ["Labelled examples", "Unlabelled data only", "No data", "Rewards only"], "a": 0, "e": "Learning with a teacher."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "Predicting tomorrow's temperature is:", "o": ["Regression", "Dimensionality reduction", "Clustering", "Classification"], "a": 0, "e": "The output is a continuous number."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "Predicting whether an email is spam is:", "o": ["PCA", "Clustering", "Classification", "Regression"], "a": 2, "e": "The output is a discrete label."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "Self-supervised learning (as in LLM pretraining) creates labels:", "o": ["From rewards", "By human annotators", "From the data itself, such as hiding the next word", "By clustering"], "a": 2, "e": "The internet becomes the labelled dataset."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "Semi-supervised learning uses:", "o": ["Only rewards", "Only labelled data", "A few labelled and many unlabelled examples", "No data"], "a": 2, "e": "It reflects the real situation, because labelling costs money."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "The k-means algorithm repeats which steps?", "o": ["Assign points to nearest centre, then move centres to cluster means", "Compute gradients, then update weights", "Split data, then merge", "Rank pages, then index"], "a": 0, "e": "Repeat until nothing moves."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "In k-means, you must choose:", "o": ["The loss function", "k, the number of clusters", "The labels", "The test set"], "a": 1, "e": "A bad k gives confident nonsense."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "Clustering differs from classification because:", "o": ["Clustering discovers groups without predefined labels", "It predicts numbers", "It always gives the true categories", "It needs labels"], "a": 0, "e": "Naming the groups is your job."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "The test set should be used:", "o": ["Repeatedly while tuning", "To choose hyperparameters", "For training", "Once, for the final evaluation"], "a": 3, "e": "The validation set is used for tuning."}, {"s": "AI", "t": "Expert Systems and Machine Learning", "q": "Peeking at test data during model development is called
